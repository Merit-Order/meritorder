AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The Merit Order console demo (docs/07-deployment.md#the-console-demo) as a static site: a private S3 bucket behind
  CloudFront, a certificate and DNS for the demo's name, and a role GitHub Actions deploys with. Deploy in us-east-1
  (CloudFront takes certificates from there only). See deploy/aws/README.md.

Parameters:
  DomainName:
    Type: String
    Default: dev.meritorder.dev
    Description: The name the demo is served at. It must be in the hosted zone below.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      The Route 53 hosted zone the name is in (aws route53 list-hosted-zones-by-name --dns-name meritorder.dev). The
      certificate is validated and the alias records are written there.
  GitHubSubjects:
    Type: CommaDelimitedList
    Default: "repo:Merit-Order@355502678/meritorder@1459849005:ref:refs/heads/main,repo:Merit-Order/meritorder:ref:refs/heads/main"
    Description: >-
      The GitHub OIDC subjects the deploy role trusts: pushes to main of these repositories only. Repositories that
      use GitHub's immutable subjects (the default for new ones; `gh api repos/<owner>/<repo>/actions/oidc/customization/sub`
      shows the prefix) send repo:<owner>@<owner id>/<repo>@<repo id>:ref:refs/heads/main, so list that form: the
      first entry is Merit-Order/meritorder's. A job that names an environment
      gets a different subject (repo:...:environment:<name>) and isn't trusted.
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      An account has at most one OIDC provider for token.actions.githubusercontent.com. "true" creates it here; "false"
      uses the one the account already has (aws iam list-open-id-connect-providers).

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # ------------------------------------------------------------------ the files

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete  # holds only the build, which the pipeline writes again; empty it before deleting the stack
    Properties:
      BucketName: !Sub "meritorder-demo-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      # Versioning stays off: every deploy is a fresh build. If someone turns it on, old versions go after a week.
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsThroughOAC
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: TLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              Bool: {aws:SecureTransport: "false"}

  # ------------------------------------------------------------------ the name

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId  # CloudFormation writes the validation record and waits for the certificate

  AliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # every CloudFront distribution's alias zone
        EvaluateTargetHealth: false

  AliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ------------------------------------------------------------------ CloudFront

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: CloudFront reads the demo bucket, which stays private
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # What the console needs, checked against the demo build: its scripts and stylesheet are files on this origin (404.html's
  # redirect too: ui/vite.config.ts writes it to 404.js), Mantine sets inline styles, the fonts are self-hosted, the
  # favicon is a data: URL, and the demo answers the console's API calls in the browser, so fetches go to 'self' only.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security"
        Comment: Merit Order demo security headers
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: false, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;
              font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none';
              frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests
        CustomHeadersConfig:
          Items:
            - {Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()", Override: true}
            - {Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Merit Order console demo (${DomainName})"
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100  # North America and Europe edges: the cheapest class
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        # How long things are kept is set on the objects (the pipeline writes Cache-Control), and CachingOptimized follows
        # it (and compresses, gzip and Brotli). /assets/*: Vite puts a content hash in every name, so a changed file is a
        # new URL: "public, max-age=31536000, immutable". index.html, 404.html, 404.js and the notices: "no-cache", so
        # browsers and the edge check for a new version on every load (a cheap 304) and a deploy shows at once.
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # The demo addresses pages by hash (/#gpus), so the only paths it serves are its files. Any other path is a
        # link or a refresh on a path such as /gpus: S3 answers 403 for a missing key (CloudFront may not list the
        # bucket), and 404.html sends the browser on to /#gpus. The status stays 404, as on GitHub Pages.
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}
          - {ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}

  # ------------------------------------------------------------------ deploys from GitHub Actions

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS checks GitHub's certificate against its own trusted CAs; the thumbprints are kept for older tooling.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-deploy"
      Description: GitHub Actions on main uploads the console demo and invalidates CloudFront
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubjects
      Policies:
        - PolicyName: deploy-demo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: WriteFiles
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Sid: Invalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: The bucket the build goes to (repository variable DEMO_BUCKET)
    Value: !Ref SiteBucket
  DistributionId:
    Description: The CloudFront distribution (repository variable DEMO_DISTRIBUTION_ID)
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront's own name for the distribution
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Description: The role GitHub Actions assumes (repository variable DEMO_DEPLOY_ROLE_ARN)
    Value: !GetAtt DeployRole.Arn
  Url:
    Description: Where the demo is served
    Value: !Sub "https://${DomainName}/"
