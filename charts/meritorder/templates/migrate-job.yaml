{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "meritorder.fullname" . }}-migrate
  labels: {{- include "meritorder.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "meritorder.selector" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- include "meritorder.podCommon" (dict "root" . "hook" true) | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "meritorder.image" . }}
          {{- include "meritorder.containerCommon" . | nindent 10 }}
          args: ["meritorder", "migrate"]
{{- end }}
