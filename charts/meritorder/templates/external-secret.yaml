{{- if .Values.externalSecret.enabled }}
{{- $_ := include "meritorder.hasSecret" . }}
{{- if not .Values.externalSecret.secretStoreRef.name }}
{{- fail "externalSecret.secretStoreRef.name is required: the (Cluster)SecretStore that reads your cloud's secret store" }}
{{- end }}
{{- if not (or .Values.externalSecret.data .Values.externalSecret.dataFrom) }}
{{- fail "externalSecret needs data or dataFrom: which cloud secrets become which environment variables" }}
{{- end }}
# Synced from your cloud's secret store by External Secrets Operator into the Secret every component
# reads its environment from. It's a pre-install/pre-upgrade hook because the migration hook needs
# MERITORDER_DATABASE_URL before anything else starts; the synced Secret is orphaned (kept) so it
# survives the hook being recreated on each upgrade. Delete it by hand after `helm uninstall`.
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "meritorder.fullname" . }}-env
  labels: {{- include "meritorder.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "meritorder.fullname" . }}-env
    creationPolicy: {{ ternary "Orphan" "Owner" .Values.migrations.enabled }}
  {{- with .Values.externalSecret.data }}
  data: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecret.dataFrom }}
  dataFrom: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
