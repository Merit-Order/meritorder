apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meritorder.fullname" . }}-gateway
  labels: {{- include "meritorder.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- include "meritorder.deploymentAnnotations" . | nindent 2 }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "meritorder.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels: {{- include "meritorder.selector" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{- include "meritorder.podMeta" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.configFiles | sha256sum }}
        checksum/env: {{ toYaml .Values.secretEnv | sha256sum }}
    spec:
      {{- include "meritorder.podCommon" (dict "root" . "hook" false) | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "meritorder.image" . }}
          {{- include "meritorder.containerCommon" . | nindent 10 }}
          args: ["meritorder", "serve", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meritorder.fullname" . }}
  labels: {{- include "meritorder.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "meritorder.selector" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.gateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "meritorder.fullname" . }}-gateway
  labels: {{- include "meritorder.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "meritorder.fullname" . }}-gateway
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- with .Values.gateway.podDisruptionBudget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "meritorder.fullname" $ }}-gateway
  labels: {{- include "meritorder.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ .minAvailable }}
  selector:
    matchLabels: {{- include "meritorder.selector" $ | nindent 6 }}
      app.kubernetes.io/component: gateway
{{- end }}
