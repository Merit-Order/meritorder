id: g4-dice-split
task: general
level: 4
kind: answer
prompt: |
  Four fair six-sided dice are rolled. We then try to split the four dice into two groups, each containing at least
  one die, so that the two groups have the same total. (For example, 1, 2, 3, 6 can be split as {6} and {1, 2, 3},
  and 2, 2, 5, 5 as {2, 5} and {2, 5}; but 1, 1, 1, 4 cannot be split.)

  What is the probability that such a split is possible? Give the answer as an exact fraction in lowest terms.

  End your reply with a line `Final answer: <a/b>`.
checks:
  - {final_number: 0.32098765432098764, tolerance: 1.0e-9}
summary: "Exact probability (26/81) that four dice split into equal-sum groups; needs inclusion-exclusion across 2+2 pairings and 1+3 splits with overlaps"
