name: Bug report
description: Something doesn't work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Security problems go to Security → Report a vulnerability, not here (see SECURITY.md).
        Remove API keys, prompts and other private data from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The request or command, and the relevant part of your configuration.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag, or the commit if you run from a clone.
    validations: {required: true}
  - type: dropdown
    id: deploy
    attributes:
      label: How you run it
      options: [uv run, Docker Compose, Helm chart, Other]
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
