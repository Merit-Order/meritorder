name: Feature request
description: Something Merit Order should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried or considered
